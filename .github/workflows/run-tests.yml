name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest            # ОС: Ubuntu (последняя версия раннера GitHub)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (LR6)
        working-directory: lab6
        run: pytest -v --cov=calculator --junitxml=../reports/lab6.xml

      - name: UI tests — login (LR3)
        working-directory: lab3
        run: pytest -v --junitxml=../reports/lab3.xml

      - name: UI tests — Page Object (LR4)
        working-directory: lab4
        run: pytest -v --junitxml=../reports/lab4.xml

      - name: API tests (LR5)
        working-directory: lab5
        run: pytest -v --junitxml=../reports/lab5.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
