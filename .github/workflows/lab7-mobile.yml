name: LR7 Mobile tests (Android emulator + Appium)

on:
  push:
    branches: [ main ]
    paths: [ "lab7/**", ".github/workflows/lab7-mobile.yml" ]
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM (аппаратное ускорение эмулятора)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: lab7/NotesApp
        run: gradle assembleDebug --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Appium Server + UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python client
        run: pip install -r lab7/requirements.txt

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: lab7
          script: bash run_on_emulator.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab7-results
          path: |
            lab7/screenshots/
            lab7/NotesApp/app/build/outputs/apk/debug/app-debug.apk
